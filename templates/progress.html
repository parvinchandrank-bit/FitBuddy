<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitBuddy Progress</title><link rel="stylesheet" href="/static/css/style.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body>
<header><div class="wrap nav"><a class="brand" href="/">💚 FITBUDDY</a><nav><a href="/">Home</a><a href="/#generator">Generate Plan</a><a href="/progress">Progress</a></nav></div></header>
<main class="wrap section"><div class="title"><span class="tag">PROGRESS DASHBOARD</span><h1 class="small">Track your journey</h1></div><div class="stats"><div class="stat"><span>Total workouts</span><strong id="total-workouts">0</strong></div><div class="stat"><span>Current weight</span><strong id="current-weight">—</strong></div><div class="stat"><span>Total records</span><strong id="total-records">0</strong></div></div>
<div class="two"><form id="progress-form" class="card"><h3>Log Progress</h3><label>Date<input id="date" type="date" required></label><label>Weight<input id="weight" type="number" step=".1" required></label><label>Workout completed<select id="completed"><option value="true">Yes</option><option value="false">No</option></select></label><label>Duration<input id="duration" type="number" value="45"></label><label>Notes<textarea id="notes"></textarea></label><button class="btn">Save Progress</button><div id="progress-message" class="message"></div></form><article class="card"><h3>Weight vs Date</h3><canvas id="chart"></canvas></article></div>
<article class="card table"><h3>Workout History</h3><table><thead><tr><th>Date</th><th>Weight</th><th>Workout</th><th>Duration</th><th>Notes</th></tr></thead><tbody id="history"></tbody></table></article></main><footer>FitBuddy · General educational information only.</footer><script src="/static/js/app.js"></script></body></html>
